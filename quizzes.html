<!DOCTYPE html>
<html>
<head>
<title>Quizzes</title>

<style>
body {
    margin: 0;
    min-height: 100vh;
    background-image: url("https://uploads.onecompiler.io/44e286jwz/44m6hu7js/Kiki.jpg");
    background-size: cover;
    background-position: center;
    background-attachment: fixed; /* Keeps background static while scrolling */
    font-family: Arial, sans-serif;
    overflow-x: hidden;
    overflow-y: auto; /* Allows scrolling when quiz cards multiply */
}

body::before {
    content: "";
    position: fixed; /* Keep pinned to viewport */
    top: 0;
    left: 0;
    width: 200%;
    height: 200%;
    background: radial-gradient(circle, rgba(255,192,203,0.3), transparent 60%);
    animation: bgMove 12s linear infinite;
    z-index: 0;
    pointer-events: none; /* Prevents interference with clicks */
}

@keyframes bgMove {
    0% { transform: translate(0,0); }
    50% { transform: translate(-20%, -10%); }
    100% { transform: translate(0,0); }
}

.sparkle {
    position: fixed;
    width: 5px;
    height: 5px;
    background: white;
    border-radius: 50%;
    opacity: 0;
    animation: floatUp linear infinite;
    z-index: 1;
}

@keyframes floatUp {
    0% { transform: translateY(100vh); opacity: 0; }
    20% { opacity: 1; }
    100% { transform: translateY(-10vh); opacity: 0; }
}

.navbar {
    position: relative; /* Changed to relative to flow naturally in document */
    padding-top: 30px;
    width: 100%;
    text-align: center;
    z-index: 10;
}

.navbar a, .uploadBtn {
    text-decoration: none;
    background-color: #FFB6C1;
    color: black;
    font-weight: bold;
    padding: 12px 35px;
    margin: 10px 15px; /* Added vertical margin for responsive wrapping */
    font-size: 18px;
    border-radius: 50px;
    border: 2px solid black;
    display: inline-block;
    cursor: pointer;
    transition: all 0.3s ease;
}

.navbar a:hover, .uploadBtn:hover {
    transform: scale(1.1) rotate(-1deg);
    background-color: #ffc0cb;
    box-shadow: 0 0 20px #ffb6c1;
}

.page-title {
    position: relative; /* Flows naturally below navbar */
    margin-top: 30px;
    margin-bottom: 20px;
    width: 100%;
    text-align: center;
    font-size: 28px;
    font-weight: bold;
    color: white;
    text-shadow: 0 0 8px black;
    z-index: 10;
}

.content {
    position: relative;
    width: 100%;
    max-width: 1200px; /* Limits gallery stretching on ultra-wide screens */
    margin: 0 auto;
    padding: 0 20px 50px 20px; /* Safe padding at bottom for scrolling */
    box-sizing: border-box;
    z-index: 10;
}

.gallery {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 30px; /* Slightly wider spacing for a cleaner look */
}

.card {
    display: flex;
    flex-direction: column;
    align-items: center;
    animation: floatCard 4s ease-in-out infinite;
    position: relative;
    width: 300px; /* Hard widths help flex items layout evenly */
}

.card:nth-child(2) { animation-delay: 0.5s; }
.card:nth-child(3) { animation-delay: 1s; }
.card:nth-child(4) { animation-delay: 1.5s; }

@keyframes floatCard {
    0% { transform: translateY(0); }
    50% { transform: translateY(-12px); }
    100% { transform: translateY(0); }
}

.card img {
    width: 100%; /* Responds to container width */
    height: 200px; /* Give images unified height dimension */
    object-fit: cover; /* Crops cleanly instead of squishing images */
    border-radius: 15px;
    border: 2px solid black;
    cursor: pointer;
    box-shadow: 0 6px 15px rgba(0,0,0,0.3);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
}

.card img:hover {
    transform: scale(1.05);
    box-shadow: 0 0 25px #ffc0cb;
}

/* CAPTION */
.caption {
    margin-top: 12px;
    font-weight: bold;
    color: white;
    text-shadow: 0 0 5px black;
    background: rgba(0,0,0,0.5);
    padding: 6px 15px;
    border-radius: 10px;
    text-align: center;
    width: 80%;
    word-wrap: break-word; /* Prevents long titles from blowing out layout */
}

.deleteBtn {
    position: absolute;
    top: -10px; /* Elevated slightly for easier access on top of image borders */
    right: -10px;
    background: #FFB6C1;
    border: 2px solid black;
    border-radius: 50%;
    width: 32px;
    height: 32px;
    font-weight: bold;
    cursor: pointer;
    z-index: 12;
    transition: transform 0.2s;
}

.deleteBtn:hover {
    transform: scale(1.15);
    background-color: #ff8da1;
}

#modal {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.7); /* Darker backdrop to make quiz readable */
    justify-content: center;
    align-items: center;
    z-index: 20;
}

#modal img {
    max-width: 85%;
    max-height: 85%;
    border-radius: 15px;
    border: 3px solid #ffb6c1;
    object-fit: contain; /* Shows full size image without clipping in view modal */
}

.closeBtn {
    position: absolute;
    top: 25px;
    right: 35px;
    font-size: 35px;
    font-weight: bold;
    background: #ffb6c1;
    border-radius: 50%;
    width: 45px;
    height: 45px;
    display: flex;
    justify-content: center;
    align-items: center;
    border: 2px solid black;
    cursor: pointer;
}
</style>
</head>

<body>

<script>
for(let i=0;i<40;i++){
    let s=document.createElement("div");
    s.className="sparkle";
    s.style.left=Math.random()*100+"vw";
    s.style.animationDuration=(3+Math.random()*6)+"s";
    s.style.animationDelay=Math.random()*5+"s";
    document.body.appendChild(s);
}
</script>

<div class="navbar">
    <a href="index.html">Home</a>
    <a href="laboratory.html">Laboratory</a>
    <a href="exams.html">Exams</a>

    <label class="uploadBtn">
        Upload
        <input type="file" accept="image/*" hidden onchange="addImage(event)">
    </label>
</div>

<div class="page-title">My Quizzes</div>

<div class="content">
    <div class="gallery" id="gallery"></div>
</div>

<div id="modal" onclick="closeImg()">
    <div class="closeBtn" onclick="closeImg(event)">×</div>
    <img id="modalImg">
</div>

<script>
let data = JSON.parse(localStorage.getItem("quizzes")) || [
    {
        src: "https://uploads.onecompiler.io/44e286jwz/44m6hu7js/6af8e2bf-7538-4b5b-a4d5-78fb3bcbad2d.jpg",
        caption: "Quiz 1"
    },
    {
        src: "https://uploads.onecompiler.io/44e286jwz/44m6hu7js/bc81e798-29d8-4456-af49-9d0ae530487e.jpg",
        caption: "Quiz 2"
    },
    {
        src: "https://uploads.onecompiler.io/44e286jwz/44m6hu7js/e241b2d9-351e-4e3d-b1ab-c441fc60ed57.jpg",
        caption: "Quiz 3"
    },
    {
        src: "d9a0f2ef-d5c6-40b0-8477-21e6b96112be (1).jpg",
        caption: "Quiz 1 Finals"
    },
    {
        src: "c0285658-0571-451a-ab06-2a926ca4a87b (1).jpg",
        caption: "Quiz 2 Finals"
    },
    {
        src: "df10c42f-7c87-4343-af1d-256f1f681336 (1).jpg",
        caption: "Long Quiz Finals midterm"
    },
    {
        src: "cf6e05b8-f513-44cb-8c9d-f2313f5911e2 (1).jpg",
        caption: "Long Quiz Finals"
    }
];

function save(){
    localStorage.setItem("quizzes", JSON.stringify(data));
}

function render(){
    let g = document.getElementById("gallery");
    g.innerHTML = "";

    data.forEach((item, i) => {
        let card = document.createElement("div");
        card.className = "card";

        card.innerHTML = `
            <button class="deleteBtn" onclick="del(event, ${i})">×</button>
            <img src="${item.src}" onclick="openImg(this.src)">
            <div class="caption">${item.caption}</div>
        `;

        g.appendChild(card);
    });
}

function addImage(event){
    let file = event.target.files[0];
    if(!file) return;

    let reader = new FileReader();
    reader.onload = e => {
        data.push({
            src: e.target.result,
            caption: "New Quiz"
        });

        save();
        render();
    };

    reader.readAsDataURL(file);
}

function del(e, i){
    e.stopPropagation(); // Prevents clicking delete from instantly opening the preview modal
    data.splice(i,1);
    save();
    render();
}

function openImg(src){
    document.getElementById("modalImg").src = src;
    document.getElementById("modal").style.display = "flex";
}

function closeImg(e){
    if(e) e.stopPropagation();
    document.getElementById("modal").style.display = "none";
}

render();
</script>

</body>
</html>
