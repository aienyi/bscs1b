<!DOCTYPE html>
<html>
<head>
<title>Quizzes</title>

<style>

body {
    margin: 0;
    height: 100vh;
    background-image: url("https://uploads.onecompiler.io/44e286jwz/44m6hu7js/Kiki.jpg");
    background-size: cover;
    background-position: center;
    font-family: Arial, sans-serif;
    overflow: hidden;
}


body::before {
    content: "";
    position: fixed;
    width: 200%;
    height: 200%;
    background: radial-gradient(circle, rgba(255,192,203,0.3), transparent 60%);
    animation: bgMove 12s linear infinite;
    z-index: 0;
}

@keyframes bgMove {
    0% { transform: translate(0,0); }
    50% { transform: translate(-20%, -10%); }
    100% { transform: translate(0,0); }
}


.sparkle {
    position: fixed;
    width: 5px;
    height: 5px;
    background: white;
    border-radius: 50%;
    opacity: 0;
    animation: floatUp linear infinite;
    z-index: 1;
}

@keyframes floatUp {
    0% { transform: translateY(100vh); opacity: 0; }
    20% { opacity: 1; }
    100% { transform: translateY(-10vh); opacity: 0; }
}


.navbar {
    position: absolute;
    top: 30px;
    width: 100%;
    text-align: center;
    z-index: 10;
}

.navbar a, .uploadBtn {
    text-decoration: none;
    background-color: #FFB6C1;
    color: black;
    font-weight: bold;
    padding: 12px 35px;
    margin: 0 15px;
    font-size: 18px;
    border-radius: 50px;
    border: 2px solid black;
    display: inline-block;
    cursor: pointer;
    transition: all 0.3s ease;
}

.navbar a:hover, .uploadBtn:hover {
    transform: scale(1.1) rotate(-1deg);
    background-color: #ffc0cb;
    box-shadow: 0 0 20px #ffb6c1;
}

.page-title{
    position: absolute;
    top: 110px;
    width: 100%;
    text-align: center;
    font-size: 28px;
    font-weight: bold;
    color: white;
    text-shadow: 0 0 8px black;
    z-index: 10;
    animation: fadeDown 1s ease;
}

@keyframes fadeDown {
    from { opacity: 0; transform: translateY(-20px); }
    to { opacity: 1; transform: translateY(0); }
}

.content{
    position: absolute;
    top: 160px;
    width: 100%;
    text-align: center;
    z-index: 10;
}

.gallery {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 25px;
}


.card {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    animation: floatCard 4s ease-in-out infinite;
}

.card:nth-child(2) { animation-delay: 0.5s; }
.card:nth-child(3) { animation-delay: 1s; }

@keyframes floatCard {
    0% { transform: translateY(0); }
    50% { transform: translateY(-12px); }
    100% { transform: translateY(0); }
}

.card img {
    width: 300px;
    border-radius: 15px;
    border: 2px solid black;
    cursor: pointer;
    box-shadow: 0 6px 15px rgba(0,0,0,0.3);
    transition: transform 0.3s ease;
}

.card img:hover {
    transform: scale(1.08);
}


.caption {
    margin-top: 8px;
    font-weight: bold;
    color: white;
    text-shadow: 0 0 5px black;
    background: rgba(0,0,0,0.4);
    padding: 5px 12px;
    border-radius: 10px;
    cursor: pointer;
}


.deleteBtn {
    position: absolute;
    top: 5px;
    right: 5px;
    background: #FFB6C1;
    border: 2px solid black;
    border-radius: 50%;
    width: 30px;
    height: 30px;
    font-weight: bold;
    cursor: pointer;
}


#modal {
    display: none;
    position: fixed;
    width: 100%;
    height: 100%;
    background: rgba(255,192,203,0.35);
    justify-content: center;
    align-items: center;
    z-index: 20;
}

#modal img {
    max-width: 80%;
    max-height: 80%;
    border-radius: 15px;
    border: 3px solid #ffb6c1;
    animation: pop 0.3s ease;
}

@keyframes pop {
    from { transform: scale(0.6); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
}

.closeBtn {
    position: absolute;
    top: 25px;
    right: 35px;
    font-size: 35px;
    font-weight: bold;
    background: #ffb6c1;
    border-radius: 50%;
    width: 45px;
    height: 45px;
    display: flex;
    justify-content: center;
    align-items: center;
    border: 2px solid black;
    cursor: pointer;
}

</style>
</head>

<body>

<script>

for(let i=0;i<40;i++){
    let s=document.createElement("div");
    s.className="sparkle";
    s.style.left=Math.random()*100+"vw";
    s.style.animationDuration=(3+Math.random()*6)+"s";
    s.style.animationDelay=Math.random()*5+"s";
    document.body.appendChild(s);
}
</script>

<div class="navbar">
    <a href="index.html">Home</a>
    <a href="laboratory.html">Laboratory</a>
    <a href="exams.html">Exams</a>

    <label class="uploadBtn">
        Upload
        <input type="file" accept="image/*" hidden onchange="addImage(event)">
    </label>
</div>

<div class="page-title">My Quizzes</div>

<div class="content">
<div class="gallery" id="gallery"></div>
</div>

<div id="modal" onclick="closeImg()">
    <div class="closeBtn" onclick="closeImg(event)">×</div>
    <img id="modalImg">
</div>

<script>

let data = JSON.parse(localStorage.getItem("quizzes")) || [];

function saveData(){
    localStorage.setItem("quizzes", JSON.stringify(data));
}

function render(){
    let gallery = document.getElementById("gallery");
    gallery.innerHTML = "";

    data.forEach((item, index) => {
        let card = document.createElement("div");
        card.className = "card";

        card.innerHTML = `
            <button class="deleteBtn" onclick="removeCard(${index})">×</button>
            <img src="${item.src}" onclick="openImg(this.src)">
            <div class="caption" onclick="editCaption(${index})">
                ${item.caption}
            </div>
        `;

        gallery.appendChild(card);
    });
}

function addImage(event){
    let file = event.target.files[0];
    if(!file) return;

    let reader = new FileReader();
    reader.onload = function(e){
        data.push({
            src: e.target.result,
            caption: "New Quiz"
        });

        saveData();
        render();
    };
    reader.readAsDataURL(file);
}

function removeCard(index){
    data.splice(index, 1);
    saveData();
    render();
}

function editCaption(index){
    let newText = prompt("Edit caption:", data[index].caption);
    if(newText !== null){
        data[index].caption = newText;
        saveData();
        render();
    }
}

function openImg(src){
    document.getElementById("modalImg").src = src;
    document.getElementById("modal").style.display = "flex";
}

function closeImg(event){
    if(event) event.stopPropagation();
    document.getElementById("modal").style.display = "none";
}

render();

</script>

</body>
</html>
