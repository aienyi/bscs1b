<!DOCTYPE html>
<html>
<head>
<title>Quizzes</title>

<style>

body {
    margin: 0;
    height: 100vh;
    background-image: url("https://uploads.onecompiler.io/44e286jwz/44m6hu7js/Kiki.jpg");
    background-size: cover;
    background-position: center;
    font-family: Arial, sans-serif;
    overflow: hidden;
}


body::before {
    content: "";
    position: fixed;
    width: 200%;
    height: 200%;
    background: radial-gradient(circle, rgba(255,192,203,0.3), transparent 60%);
    animation: bgMove 12s linear infinite;
    z-index: 0;
}

@keyframes bgMove {
    0% { transform: translate(0,0); }
    50% { transform: translate(-20%, -10%); }
    100% { transform: translate(0,0); }
}

.sparkle {
    position: fixed;
    width: 5px;
    height: 5px;
    background: white;
    border-radius: 50%;
    opacity: 0;
    animation: floatUp linear infinite;
    z-index: 1;
}

@keyframes floatUp {
    0% { transform: translateY(100vh); opacity: 0; }
    20% { opacity: 1; }
    100% { transform: translateY(-10vh); opacity: 0; }
}

.navbar {
    position: absolute;
    top: 30px;
    width: 100%;
    text-align: center;
    z-index: 10;
}

.navbar a {
    text-decoration: none;
    background-color: #FFB6C1;
    color: black;
    font-weight: bold;
    padding: 12px 35px;
    margin: 0 15px;
    font-size: 18px;
    border-radius: 50px;
    border: 2px solid black;
    display: inline-block;
    transition: all 0.3s ease;
}

.navbar a:hover {
    transform: scale(1.1) rotate(-1deg);
    background-color: #ffc0cb;
    box-shadow: 0 0 20px #ffb6c1;
}

.page-title{
    position: absolute;
    top: 110px;
    width: 100%;
    text-align: center;
    font-size: 28px;
    font-weight: bold;
    color: white;
    text-shadow: 0 0 8px black;
    z-index: 10;
    animation: fadeDown 1s ease;
}

@keyframes fadeDown {
    from { opacity: 0; transform: translateY(-20px); }
    to { opacity: 1; transform: translateY(0); }
}

.content{
    position: absolute;
    top: 160px;
    width: 100%;
    text-align: center;
    z-index: 10;
}

.gallery {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 25px;
}


.card {
    display: flex;
    flex-direction: column;
    align-items: center;
    animation: floatCard 4s ease-in-out infinite;
}

.card:nth-child(2) { animation-delay: 0.5s; }
.card:nth-child(3) { animation-delay: 1s; }

@keyframes floatCard {
    0% { transform: translateY(0); }
    50% { transform: translateY(-12px); }
    100% { transform: translateY(0); }
}

.card img {
    width: 300px;
    border-radius: 15px;
    border: 2px solid black;
    cursor: pointer;
    box-shadow: 0 6px 15px rgba(0,0,0,0.3);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
}

.card img:hover {
    transform: scale(1.08);
    box-shadow: 0 0 25px #ffc0cb;
}

.caption {
    margin-top: 8px;
    font-weight: bold;
    color: white;
    text-shadow: 0 0 5px black;
    background: rgba(0,0,0,0.4);
    padding: 5px 12px;
    border-radius: 10px;
}


#modal {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(255,192,203,0.35);
    justify-content: center;
    align-items: center;
    z-index: 20;
}

#modal img {
    max-width: 80%;
    max-height: 80%;
    border-radius: 15px;
    border: 3px solid #ffb6c1;
    box-shadow: 0 0 25px #ffc0cb;
    animation: pop 0.3s ease;
}

@keyframes pop {
    from { transform: scale(0.6); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
}

.closeBtn {
    position: absolute;
    top: 25px;
    right: 35px;
    font-size: 35px;
    font-weight: bold;
    color: black;
    cursor: pointer;
    background: #ffb6c1;
    border-radius: 50%;
    width: 45px;
    height: 45px;
    display: flex;
    justify-content: center;
    align-items: center;
    border: 2px solid black;
    transition: 0.3s ease;
}

.closeBtn:hover {
    background: #ff9eb5;
    transform: rotate(90deg);
}

</style>
</head>

<body>

<script>
for(let i=0;i<40;i++){
    let s=document.createElement("div");
    s.className="sparkle";
    s.style.left=Math.random()*100+"vw";
    s.style.animationDuration=(3+Math.random()*6)+"s";
    s.style.animationDelay=Math.random()*5+"s";
    document.body.appendChild(s);
}
</script>

<div class="navbar">
    <a href="index.html">Home</a>
    <a href="laboratory.html">Laboratory</a>
    <a href="exams.html">Exams</a>
</div>

<div class="page-title">My Quizzes</div>

<div class="content">

<div class="gallery">

    <div class="card">
        <img src="https://uploads.onecompiler.io/44e286jwz/44m6hu7js/6af8e2bf-7538-4b5b-a4d5-78fb3bcbad2d.jpg" onclick="openImg(this.src)">
        <div class="caption">Quiz 1</div>
    </div>

    <div class="card">
        <img src="https://uploads.onecompiler.io/44e286jwz/44m6hu7js/bc81e798-29d8-4456-af49-9d0ae530487e.jpg" onclick="openImg(this.src)">
        <div class="caption">Quiz 2</div>
    </div>
    
    <div class="card">
        <img src="https://uploads.onecompiler.io/44e286jwz/44m6hu7js/e241b2d9-351e-4e3d-b1ab-c441fc60ed57.jpg" onclick="openImg(this.src)">
        <div class="caption">Quiz 3</div>
    </div>

</div>

</div>

<div id="modal" onclick="closeImg()">
    <div class="closeBtn" onclick="closeImg(event)">×</div>
    <img id="modalImg">
</div>

<script>
function openImg(src){
    document.getElementById("modalImg").src = src;
    document.getElementById("modal").style.display = "flex";
}

function closeImg(event){
    if(event) event.stopPropagation();
    document.getElementById("modal").style.display = "none";
}
</script>

</body>
</html>
