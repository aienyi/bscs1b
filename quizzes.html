<!DOCTYPE html>
<html>
<head>
<title>Quizzes</title>

<style>

body {
    margin: 0;
    height: 100vh;

    background-image: url("https://uploads.onecompiler.io/44e286jwz/44fh2kq8u/download%20(14).jpg");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;

    font-family: Arial, sans-serif;
}

.navbar {
    position: absolute;
    top: 30px;
    width: 100%;
    text-align: center;
}

.navbar a {
    text-decoration: none;
    background-color: #FFB6C1;
    color: black;
    font-weight: bold;
    padding: 12px 35px;
    margin: 0 15px;
    font-size: 18px;
    border-radius: 50px;
    border: 2px solid black;
}

.navbar a:hover {
    background-color: #ff9eb5;
}

.page-title{
    position: absolute;
    top: 110px;
    width: 100%;
    text-align: center;
    font-size: 26px;
    font-weight: bold;
}

.content{
    position: absolute;
    top: 160px;
    width: 100%;
    text-align: center;
    font-size: 18px;
}

</style>

</head>
<body>

<div class="navbar">
    <a href="index.html">Home</a>
    <a href="activities.html">Activities</a>
    <a href="exams.html">Exams</a>
</div>

<div class="page-title">My Quizzes</div>

<div class="content">
<p>This is where my quizzes will appear.</p>

<br><br>

<div id="quizContainer" style="display:flex; justify-content:center; gap:20px; flex-wrap:wrap;">
    
    <label style="
        display:flex;
        justify-content:center;
        align-items:center;
        width:80px;
        height:80px;
        border:2px dashed black;
        border-radius:15px;
        font-size:40px;
        cursor:pointer;
        background-color:#ffe4ec;
    ">
        +
        <input type="file" accept="image/*" style="display:none;" onchange="addImage(event)">
    </label>

</div>

</div>

<script>
let images = JSON.parse(localStorage.getItem("quizImages")) || [];

function saveImages() {
    localStorage.setItem("quizImages", JSON.stringify(images));
}

function displayImages() {
    const container = document.getElementById("quizContainer");

   
    const labels = container.querySelectorAll("label");
    container.innerHTML = "";
    labels.forEach(label => container.appendChild(label));

    images.forEach(src => {
        const img = document.createElement("img");
        img.src = src;
        img.style.width = "300px";
        img.style.borderRadius = "15px";
        img.style.border = "2px solid black";

        container.insertBefore(img, container.firstChild);
    });
}

function addImage(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();

    reader.onload = function(e) {
        images.push(e.target.result);
        saveImages();
        displayImages();
    };

    reader.readAsDataURL(file);
}


window.onload = displayImages;
</script>

</body>
</html>
